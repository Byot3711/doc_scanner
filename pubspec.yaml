name: doc_scanner_pro
description: Professional document scanner with OCR and PDF generation.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  google_mlkit_text_recognition: ^0.11.0
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  fluttertoast: ^8.2.2
  share_plus: ^7.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.0.5
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
