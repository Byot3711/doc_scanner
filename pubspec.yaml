name: doc_scanner_pro
description: Professional document scanner by Valentin Constantinescu.
publish_to: 'none'
version: 7.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_document_scanner: ^0.4.0
  image_cropper: ^8.0.2
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  fluttertoast: ^8.2.2
  share_plus: ^7.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.0.5
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
